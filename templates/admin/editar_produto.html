{% extends 'admin/base.html' %}

{% block content %}

<h3 style="background-color: rgb(198, 197, 197);">
  Editar Produto
</h3>

<div class="container">

    <form method="post" enctype="multipart/form-data">
      <div class="form-group">
        <label for="nome_produto">Nome do Produto</label>
        <input type="text" class="form-control" id="nome_produto" name="nome_produto">
      </div>

      <div class="form-group">
        <label for="preco">Preço</label>
        <input type="text" class="form-control" id="preco" name="preco_produto">
      </div>

      <div class="form-group">
        <label for="ativo" id="ativo" class="form-label">Status</label>
        <select class="form-select" name="ativo">
          <option value="true" {% if produto.ativo =='True' %}selected{% endif %}>Ativo</option>
          <option value="False" {% if produto.ativo =='False' %}selected{% endif %}>Inativo</option>
        </select>
      </div>
      
      <div class="form-group">
        <label for="categoria">Categoria</label>
        <select name="categoria" id="categoria">
          {% for categoria in categorias %}
            <option value="{{categoria.id}}">{{categoria.nome}}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="imagem_atual">Imagem Atual:</label>
        <img src="data:image/jpeg;base64, {{produto['imagem']}}" alt="Imagem Atual"
        style = "width: 200px;">
      </div>

      <div class="form-group">
        <label for="imagen">Imagem</label>
        <input type="file" class="form-control" id="imagem" name="imagem">
      </div> <br>

      <button type="submit" class="btn btn-primary mb-2">Editar</button>

    </form>

</div>



{% endblock %}
